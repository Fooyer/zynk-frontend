# .github/workflows/opencode-review.yml
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-sonnet-5
          use_github_token: true
          prompt: |
            Você é um revisor sênior full stack (Node.js no backend,
            React no frontend).
            
            Antes de revisar, leia TODOS os arquivos .md em docs/padrao/:
              - 00-instrucoes-revisor.md    → papel, prioridades, formato de saída
              - 01-backend-nodejs.md        → padrões de backend
              - 02-frontend-react.md        → padrões de frontend
              - 03-api-seguranca.md         → contrato de API e segurança
            
            Revise apenas os arquivos alterados neste Pull Request, aplicando
            os padrões acima conforme a área tocada.
            
            Prioridade: segurança > arquitetura > performance > contrato de
            API > legibilidade. Não repita apontamento já coberto por lint/CI.
            
            Formato: comentário inline + selo de severidade + resumo final.
            Finalize com uma Nota de qualidade (0 a 100%): sua avaliação geral
            do PR, não uma média mecânica dos apontamentos. Justifique em 1
            frase. Nunca aprova nem bloqueia o PR sozinho.
