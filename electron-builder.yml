appId: com.zynk.desktop
productName: Zynk
directories:
  output: release
files:
  - dist
  - dist-electron
asar: true
icon: build/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
afterPack: ./scripts/set-icon.js
win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: false
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
