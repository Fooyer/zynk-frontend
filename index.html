<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://zynk.fooyer.space" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Zynk</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0c0d1a;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .logo {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #e2e4ed;
        letter-spacing: -0.02em;
        margin-bottom: 1.5rem;
      }
      #splash .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(139, 145, 167, 0.2);
        border-top-color: #7c6bf5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-surface-900 text-surface-100">
    <div id="splash">
      <div class="logo">Zynk</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
