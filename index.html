<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://zynk.fooyer.space" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Zynk</title>
    <!-- Externo, não inline — CSP de produção não libera 'unsafe-inline' pra
         scripts. Ver public/bootstrap.js. -->
    <script src="./bootstrap.js"></script>
    <style>
      html, body {
        background: transparent;
      }
      html.native-frame, html.native-frame body {
        background: #0a0a0b;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0c0d1a;
        border-radius: 10px;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      html.native-frame #splash {
        border-radius: 0;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .logo {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: #e2e4ed;
        letter-spacing: -0.02em;
        margin-bottom: 1.5rem;
      }
      #splash .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(139, 145, 167, 0.2);
        border-top-color: #7c6bf5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* A splash tem paleta própria (fora do Tailwind/React) e continua fixa
         para os temas escuros — some em menos de 1s, ganho marginal em
         re-temar todas as 5 variantes. O modo claro é a exceção: sem este
         ajuste, a splash escura ficaria visivelmente errada logo antes do
         fade para uma UI clara. */
      html[data-theme='light'] #splash {
        background: #f7f7f7;
      }
      html[data-theme='light'] #splash .logo {
        color: #111111;
      }
      html[data-theme='light'] #splash .spinner {
        border-color: rgba(0, 0, 0, 0.12);
        border-top-color: #b3001d;
      }
    </style>
  </head>
  <body class="text-surface-100">
    <div id="splash">
      <div class="logo">Zynk</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
